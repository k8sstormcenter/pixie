---
name: 'filename-linter'
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  check-files-changed:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
    - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
      id: changes
      with:
        # Fork carve-outs: private/cockpit/ + terraform/credentials/cockpit/
        # are LEGITIMATE fork config for the AOCC pixie-cloud deployment;
        # they were on the fork before upstream main introduced
        # filename_linter and stayed when the cert-manager migration
        # (#2391) deleted them upstream. Negative-globbing them keeps
        # the original "no private/* leaks" guard while letting the
        # fork's known-private deployment files through.
        filters: |
          private:
          - '**/*private*/**'
          - '**/*private*'
          - '!private/cockpit/**'
          - '!terraform/credentials/cockpit/**'
    - name: Fail on private
      if: ${{ steps.changes.outputs.private == 'true' }}
      run: echo "This repo disallows dirnames or filenames with 'private' in it." && exit 1
