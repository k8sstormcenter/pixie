# Kubescape ApplicationProfile for the vulnerable redis deployment used by the
# sovereign-soc perf_tool suite. This profile is pre-populated (no learning
# phase needed) so that attacks fired against redis trigger anomaly alerts
# immediately. The profile shape is taken verbatim from the sovereignsocdemo
# playground startup file:
#   https://github.com/k8sstormcenter/sovereignsocdemo/blob/main/index.md
# (section "playground.startupFiles[/home/laborant/redis-sbob.yaml]")
#
# Apache-2.0 licensed alongside the upstream demo.
apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ApplicationProfile
metadata:
  name: redis
  namespace: redis
spec:
  architectures:
  - amd64
  containers:
  - capabilities:
    - CAP_CHOWN
    - CAP_DAC_OVERRIDE
    - CAP_DAC_READ_SEARCH
    - CAP_SETGID
    - CAP_SETPCAP
    - CAP_SETUID
    - CAP_SYS_ADMIN
    endpoints: null
    execs:
    - args:
      - /usr/local/bin/redis-cli
      - ping
      path: /usr/local/bin/redis-cli
    identifiedCallStacks: null
    imageID: ghcr.io/k8sstormcenter/redis-vulnerable@sha256:aec7a0c5713a190ed4e02b30a9f066cb1d7137531d8c3bca21c2781ca8a7d945
    imageTag: ghcr.io/k8sstormcenter/redis-vulnerable:7.2.10
    name: redis
    opens:
    - flags:
      - O_CLOEXEC
      - O_RDONLY
      path: /etc/group
    - flags:
      - O_CLOEXEC
      - O_RDONLY
      path: /etc/ld.so.cache
    - flags:
      - O_CLOEXEC
      - O_RDONLY
      path: /etc/passwd
    - flags:
      - O_CLOEXEC
      - O_RDONLY
      path: /proc/⋯
    - flags:
      - O_CLOEXEC
      - O_RDONLY
      path: /proc/⋯/kernel/*
    - flags:
      - O_CLOEXEC
      - O_RDONLY
      path: /proc/⋯/setgroups
    - flags:
      - O_RDONLY
      path: /proc/⋯/stat
    - flags:
      - O_CLOEXEC
      - O_RDONLY
      - O_WRONLY
      path: /proc/⋯/task/*
    - flags:
      - O_CLOEXEC
      - O_RDONLY
      path: /⋯/kernel/*
    - flags:
      - O_CLOEXEC
      - O_RDONLY
      path: /⋯/setgroups
    - flags:
      - O_CLOEXEC
      - O_RDONLY
      path: /runc
    - flags:
      - O_RDONLY
      path: /⋯/stat
    - flags:
      - O_CLOEXEC
      - O_RDONLY
      - O_WRONLY
      path: /⋯/task/*
    - flags:
      - O_RDONLY
      path: /sys/kernel/mm/transparent_hugepage/hpage_pmd_size
    - flags:
      - O_CLOEXEC
      - O_RDONLY
      path: /sys/fs/cgroup/*
    - flags:
      - O_CLOEXEC
      - O_RDONLY
      path: /usr/lib/x86_64-linux-gnu/libc.so.6
    - flags:
      - O_CLOEXEC
      - O_RDONLY
      path: /usr/lib/x86_64-linux-gnu/libm.so.6
    rulePolicies:
      R0002:
        processAllowed:
          - runc
          - "runc:[2:INIT]"
    seccompProfile:
      spec:
        defaultAction: ""
    syscalls:
    - accept4
    - access
    - arch_prctl
    - brk
    - close
    - connect
    - epoll_ctl
    - epoll_wait
    - exit_group
    - fcntl
    - getpid
    - getrandom
    - ioctl
    - mmap
    - mprotect
    - munmap
    - newfstatat
    - openat
    - poll
    - pread64
    - prlimit64
    - read
    - recvfrom
    - rseq
    - sendto
    - set_robust_list
    - set_tid_address
    - setsockopt
    - socket
    - uname
    - write
    - writev
