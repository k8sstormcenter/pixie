# postgres — tier 3 (persistent data) for the multi-protocol three-tier
# load fixture. Deployed in the `redis` namespace alongside the existing
# redis pod so a single Kubescape ApplicationProfile + bobctl attack
# surface covers the whole stack. Schema seeded by initdb ConfigMap on
# first boot (idempotent: psql executes /docker-entrypoint-initdb.d/*.sql
# only when PGDATA is empty).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: redis
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: sovereign-soc
data:
  init.sql: |
    -- items: GET path hot table, served from redis cache.
    CREATE TABLE IF NOT EXISTS items (
      id   INTEGER PRIMARY KEY,
      name TEXT NOT NULL,
      data TEXT NOT NULL
    );
    -- events: POST path append-only sink, also invalidates redis.
    CREATE TABLE IF NOT EXISTS events (
      id        BIGSERIAL PRIMARY KEY,
      created   TIMESTAMPTZ NOT NULL DEFAULT now(),
      payload   TEXT NOT NULL
    );
    -- Pre-populate 100 items so the loadgen's random-id GET hits a real
    -- row most of the time (cache hit/miss ratio is observable in
    -- redis_events vs pgsql_events rate).
    INSERT INTO items (id, name, data)
    SELECT i,
           'item-' || i,
           md5(i::text) || md5((i+1)::text) || md5((i+2)::text)
    FROM generate_series(1, 100) AS s(i)
    ON CONFLICT (id) DO NOTHING;
    CREATE INDEX IF NOT EXISTS events_created_idx ON events (created DESC);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: redis
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: sovereign-soc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: sovereign-soc
        # Pairs with postgres-sbob.yaml's `postgres-empty` profile so
        # kubescape alerts from t=0. See feedback_kubescape_empty_profile.
        kubescape.io/user-defined-profile: postgres-empty
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - {name: pg, containerPort: 5432}
        env:
        - {name: POSTGRES_DB, value: appdb}
        - {name: POSTGRES_USER, value: app}
        - {name: POSTGRES_PASSWORD, value: app_password}
        # Alpine init script runs initdb in /var/lib/postgresql/data,
        # we explicitly point PGDATA at a subpath so the mount root is
        # initdb-clean (postgres refuses to init in a non-empty dir).
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        volumeMounts:
        - {name: initdb, mountPath: /docker-entrypoint-initdb.d}
        - {name: data, mountPath: /var/lib/postgresql/data}
        resources:
          requests: {cpu: 200m, memory: 256Mi}
          limits:   {cpu: "2",  memory: 1Gi}
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "app", "-d", "appdb"]
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: initdb
        configMap: {name: postgres-initdb}
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: redis
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: sovereign-soc
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - {name: pg, port: 5432, targetPort: pg}
