---
name: perf-eval-clickhouse
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit'
        required: false
        type: string
      tags:
        description: 'Tags (comma separated)'
        required: false
        type: string
permissions:
  contents: read
  packages: write
jobs:
  get-dev-image-with-extras:
    uses: ./.github/workflows/get_image.yaml
    with:
      image-base-name: "dev_image_with_extras"
      ref: ${{ inputs.ref }}

  clickhouse-export-perf:
    name: ClickHouse export perf eval
    needs: get-dev-image-with-extras
    runs-on: oracle-vm-16cpu-64gb-x86-64
    container:
      image: ${{ needs.get-dev-image-with-extras.outputs.image-with-tag }}
      options: --cap-add=NET_ADMIN --device=/dev/net/tun
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0
    - name: Add pwd to git safe dir
      run: git config --global --add safe.directory `pwd`
    - id: get-commit-sha
      run: echo "commit-sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # TODO(ddelnano): swap TAILSCALE_AUTH_KEY for an OAuth client once one is
    # provisioned in the k8sstormcenter tailnet. Use
    # `tailscale/github-action@v2` with `oauth-client-id` and `oauth-secret`
    # inputs (`TS_OAUTH_CLIENT_ID` / `TS_OAUTH_CLIENT_SECRET` secrets) so
    # credentials rotate automatically instead of expiring on a fixed cadence.
    - name: Start Tailscale sidecar
      env:
        TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh
        mkdir -p /var/run/tailscale /var/lib/tailscale
        tailscaled \
          --socket=/var/run/tailscale/tailscaled.sock \
          --state=/var/lib/tailscale/tailscaled.state &
        until tailscale status --json >/dev/null 2>&1; do sleep 1; done
        tailscale up \
          --authkey="${TS_AUTHKEY}" \
          --accept-routes \
          --hostname="pixie-perf-ci-${GITHUB_RUN_ID}"

    - name: Write kubeconfig
      env:
        KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      run: |
        mkdir -p "${RUNNER_TEMP}"
        echo "${KUBECONFIG_B64}" | base64 -d > "${RUNNER_TEMP}/kubeconfig"
        chmod 600 "${RUNNER_TEMP}/kubeconfig"

    # Fail fast if Tailscale can't reach the cluster API, before the 2+ minute
    # bazel/skaffold build wastes time.
    - name: Tailscale connectivity probe
      env:
        KUBECONFIG: ${{ runner.temp }}/kubeconfig
      run: |
        tailscale status
        tailscale netcheck
        api_host="$(kubectl --kubeconfig="$KUBECONFIG" config view --minify -o jsonpath='{.clusters[0].cluster.server}' | sed -E 's|https?://||; s|/.*||')"
        api_ip="${api_host%%:*}"
        api_port="${api_host##*:}"
        echo "--- tailscale ping ${api_ip} ---"
        tailscale ping --c 3 --until-direct=false "${api_ip}" || true
        echo "--- tcp probe ${api_ip}:${api_port} ---"
        timeout 5 bash -c "</dev/tcp/${api_ip}/${api_port}" \
          && echo "API port reachable" \
          || { echo "API port UNREACHABLE"; exit 1; }
        echo "--- kubectl get nodes ---"
        kubectl --kubeconfig="$KUBECONFIG" get nodes

    - name: Use github bazel config
      uses: ./.github/actions/bazelrc
      with:
        download_toplevel: 'true'
        BB_API_KEY: ${{ secrets.BB_IO_API_KEY }}

    # TODO(ddelnano): revert to `./.github/actions/gcloud_creds` once GCP_SA_KEY
    # is re-uploaded with `base64 -w0`. The shared composite uses plain
    # `base64 --decode` which rejects the wrapped (multi-line/CRLF) value
    # currently stored in the secret.
    - id: gcloud-creds
      env:
        SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SA_KEY }}
      run: |
        printf '%s' "$SERVICE_ACCOUNT_KEY" | base64 -di > /tmp/gcloud.json
        chmod 600 /tmp/gcloud.json
        echo "gcloud-creds=/tmp/gcloud.json" >> $GITHUB_OUTPUT
    - name: Activate gcloud service account
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcloud-creds.outputs.gcloud-creds }}
      run: |
        service_account="$(jq -r '.client_email' "$GOOGLE_APPLICATION_CREDENTIALS")"
        gcloud auth activate-service-account "${service_account}" --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
        gcloud auth configure-docker

    - name: Log in to GHCR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Build and install px CLI
      run: |
        bazel build //src/pixie_cli:px
        install -m 0755 bazel-bin/src/pixie_cli/px_/px /usr/local/bin/px
        px version

    # Pixie's cloud dedups clusters by the kube-system namespace UID, which is
    # stable across reinstalls on this long-lived cluster. vzmgr rejects a
    # redeploy while the prior install's cloud record is still non-DISCONNECTED
    # (ErrProvisionFailedVizierIsActive), so `px deploy` crash-loops on "Timed
    # out waiting for cluster ID assignment" until the cloud StatusMonitor flips
    # the stale record to DISCONNECTED -- up to 15m if the old record was left
    # in UPDATING (durationBeforeUpdateDisconnect). Pre-emptively delete the
    # prior install (stops heartbeats) and wait for the cloud to report the
    # cluster DISCONNECTED so the subsequent deploy reuses the record on the
    # first try instead of racing that timeout.
    - name: Ensure prior Pixie install is disconnected
      env:
        PX_API_KEY: ${{ secrets.PX_API_KEY }}
        PX_CLOUD_ADDR: ${{ vars.PERF_CLOUD_ADDR }}
        KUBECONFIG: ${{ runner.temp }}/kubeconfig
      run: |
        set -euo pipefail

        # Authenticate the CLI to the cloud non-interactively (PX_API_KEY /
        # PX_CLOUD_ADDR are read from the env by viper).
        px auth login --use_api_key

        # `px deploy` registers the cluster under the current kubeconfig context
        # name (deploy.go: clusterName defaults to kubeAPIConfig.CurrentContext),
        # so match the cloud record on that same value.
        cluster_name="$(kubectl config current-context)"
        echo "Target cluster name: ${cluster_name}"

        # Tear down any existing install so it stops heartbeating; that lets the
        # StatusMonitor transition the record to DISCONNECTED.
        if kubectl get ns pl >/dev/null 2>&1; then
          echo "Existing Pixie install found in 'pl' namespace; deleting..."
          px delete --clobber || true
        else
          echo "No existing 'pl' namespace; nothing to delete."
        fi

        # Poll the cloud until the cluster record is DISCONNECTED or absent.
        # CS_DISCONNECTED == 3 in cloudpb.ClusterStatus; `-o json` serializes the
        # enum as its integer value.
        deadline=$(( SECONDS + 1080 ))   # 18m: covers the 15m UPDATING window + buffer
        while (( SECONDS < deadline )); do
          status="$(px get viziers -o json 2>/dev/null \
            | jq -r --arg n "${cluster_name}" 'select(.ClusterName == $n) | .Status' || true)"
          if [[ -z "${status}" ]]; then
            echo "Cluster '${cluster_name}' is not registered in the cloud; proceeding."
            exit 0
          fi
          if [[ "${status}" == "3" || "${status}" == "CS_DISCONNECTED" ]]; then
            echo "Cluster '${cluster_name}' is DISCONNECTED; safe to deploy."
            exit 0
          fi
          echo "Cluster '${cluster_name}' status=${status}; waiting for DISCONNECTED (3)..."
          sleep 15
        done
        echo "Timed out after 18m waiting for cluster '${cluster_name}' to disconnect." >&2
        exit 1

    - name: Run clickhouse-export perf
      env:
        PX_API_KEY: ${{ secrets.PX_API_KEY }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcloud-creds.outputs.gcloud-creds }}
        KUBECONFIG: ${{ runner.temp }}/kubeconfig
      run: |
        bazel run //src/e2e_test/perf_tool:perf_tool -- run \
          --api_key="${PX_API_KEY}" \
          --cloud_addr=${{ vars.PERF_CLOUD_ADDR }} \
          --commit_sha="${{ steps.get-commit-sha.outputs.commit-sha }}" \
          --experiment_name=clickhouse-export \
          --suite=clickhouse-exec \
          --use_local_cluster \
          --export_backend=parquet-gcs \
          --gcs_bucket=k8sstormcenter-soc-perf \
          --container_repo=ghcr.io/k8sstormcenter \
          --prom_recorder_override 'clickhouse-operator=:k8ss-forensic' \
          --tags "${{ inputs.tags }}"

    - name: Deactivate gcloud service account
      if: always()
      run: gcloud auth revoke || true

    - name: Tailscale logout
      if: always()
      run: tailscale logout || true
