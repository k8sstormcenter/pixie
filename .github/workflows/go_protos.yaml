---
name: go-protos
run-name: go-protos ${{ inputs.ref }}
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to generate for"
        required: true
        type: string
      labels:
        description: "Space separated list of go_proto_library labels"
        required: true
        type: string
permissions:
  contents: read
jobs:
  get-dev-image:
    uses: ./.github/workflows/get_image.yaml
    with:
      image-base-name: "dev_image"
      ref: ${{ inputs.ref }}
  generate:
    runs-on: oracle-vm-16cpu-64gb-x86-64
    needs: get-dev-image
    timeout-minutes: 120
    container:
      image: ${{ needs.get-dev-image.outputs.image-with-tag }}
      options: --cpus 7
    env:
      LABELS: ${{ inputs.labels }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        ref: ${{ inputs.ref }}
    - name: Add pwd to git safe dir
      run: git config --global --add safe.directory `pwd`
    - name: Run update go protos
      shell: bash
      run: |
        read -r -a labels <<< "${LABELS}"
        scripts/update_go_protos.sh "${labels[@]}"
        git diff --stat
        git diff > go_protos.patch
    - name: Upload patch
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: go-protos
        path: go_protos.patch
