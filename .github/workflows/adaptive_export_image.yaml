---
# Build and push the adaptive_export operator image to
# ghcr.io/k8sstormcenter/vizier-adaptive_export_image. This is a
# fork-specific publish workflow — the upstream pixie release flow
# bundles every vizier image together (k8s/vizier/BUILD.bazel
# VIZIER_IMAGE_TO_LABEL), but the SBOB PoC only iterates on this one
# component and we don't want to rebuild kelvin / pem / metadata on
# every adaptive_export change.
#
# Triggers:
#   - workflow_dispatch (manual rebuild for any commit)
#   - push to entlein/adaptive-write-perf (the PoC branch)
#
# Tag scheme matches the existing manually-pushed tags on
# ghcr.io/k8sstormcenter/vizier-adaptive_export_image:
#   - <YYYY-MM-DD_HH-MM-SS_UTC>  (timestamp, primary tag)
#   - <short-sha>                (commit pin, secondary tag)
# `latest` is intentionally NOT updated so we don't shift what an
# `:latest` puller resolves to without an explicit ack.
name: adaptive-export-image
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build (defaults to the workflow ref)'
        required: false
        type: string
  push:
    branches:
    - entlein/adaptive-write-perf
    paths:
    - 'src/vizier/services/adaptive_export/**'
    - '.github/workflows/adaptive_export_image.yaml'
permissions:
  contents: read
  packages: write
jobs:
  get-dev-image-with-extras:
    uses: ./.github/workflows/get_image.yaml
    with:
      image-base-name: "dev_image_with_extras"
      ref: ${{ inputs.ref }}

  build-and-push:
    name: Build and push adaptive_export image
    needs: get-dev-image-with-extras
    runs-on: oracle-vm-16cpu-64gb-x86-64
    container:
      image: ${{ needs.get-dev-image-with-extras.outputs.image-with-tag }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0
    - name: Add pwd to git safe dir
      run: git config --global --add safe.directory `pwd`
    - id: tags
      run: |
        TS="$(date -u +%Y-%m-%d_%H-%M-%S.%3N_UTC)"
        SHA="$(git rev-parse --short HEAD)"
        echo "ts=${TS}" >> "$GITHUB_OUTPUT"
        echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
    - name: Use github bazel config
      uses: ./.github/actions/bazelrc
      with:
        download_toplevel: 'true'
        BB_API_KEY: ${{ secrets.BB_IO_API_KEY }}
    - name: Log in to GHCR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
    - name: Build image tar
      shell: bash
      run: |
        # Explicitly target the .tar output: `bazel build :foo_image`
        # only materializes the layer tar (the rule's primary output);
        # the full-image .tar is an implicit secondary output and is
        # NOT placed into bazel-bin unless requested by name.
        bazel build --config=x86_64_sysroot \
          //src/vizier/services/adaptive_export:adaptive_export_image.tar
    - name: Load to docker
      id: load
      shell: bash
      run: |
        # `docker load -i …` prints "Loaded image ID: sha256:<digest>"
        # (or "Loaded image: <repo>:<tag>" for an image-with-tag tar).
        # bazel's pl_go_image / container_image emits an untagged image
        # so we get the digest line; parse it directly without the
        # rules_docker .executable wrapper script (which doesn't always
        # land in bazel-bin and is what tripped the prior workflow run).
        TAR="bazel-bin/src/vizier/services/adaptive_export/adaptive_export_image.tar"
        ls -lh "${TAR}"
        OUT="$(docker load -i "${TAR}")"
        echo "${OUT}"
        IMG_ID="$(echo "${OUT}" | grep -oE 'sha256:[a-f0-9]+' | head -1 | cut -d: -f2)"
        if [ -z "${IMG_ID}" ]; then
          # Fallback: tar was loaded with a repo:tag; capture it instead.
          REPO_TAG="$(echo "${OUT}" | sed -n 's/^Loaded image: //p' | head -1)"
          if [ -z "${REPO_TAG}" ]; then
            echo "FAIL: could not parse image identity from docker load output above"
            exit 1
          fi
          IMG_ID="${REPO_TAG}"
        fi
        echo "img_id=${IMG_ID}" >> "$GITHUB_OUTPUT"
    - name: Tag and push
      shell: bash
      env:
        IMG_ID: ${{ steps.load.outputs.img_id }}
        TS: ${{ steps.tags.outputs.ts }}
        SHA: ${{ steps.tags.outputs.sha }}
      run: |
        IMAGE="ghcr.io/k8sstormcenter/vizier-adaptive_export_image"
        docker tag "${IMG_ID}" "${IMAGE}:${TS}"
        docker tag "${IMG_ID}" "${IMAGE}:${SHA}"
        docker push "${IMAGE}:${TS}"
        docker push "${IMAGE}:${SHA}"
        echo "Pushed:"
        echo "  ${IMAGE}:${TS}"
        echo "  ${IMAGE}:${SHA}"
