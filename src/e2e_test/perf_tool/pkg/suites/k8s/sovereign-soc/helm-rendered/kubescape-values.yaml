storage:
  image:
    repository: ghcr.io/k8sstormcenter/storage
    tag: "dev-e64d59a"

nodeAgent:
  image:
    repository: ghcr.io/k8sstormcenter/node-agent
    tag: "dev-e64d59a"
  config:
    maxLearningPeriod: 2m
    learningPeriod: 2m
    updatePeriod: 10000m
    # The Service declares a "prometheus" port (8080) but node-agent's stock
    # config disables the exporter. Enable it so the perf_tool's
    # KubescapeNodeAgentMetrics recorder can scrape per-node alert/event
    # counters. Note: the chart key is the string "enable"/"disable", which
    # the chart converts to the JSON `prometheusExporterEnabled` boolean
    # in the node-agent ConfigMap.
    prometheusExporter: enable
    ruleCooldown:
      ruleCooldownDuration: 0h
      ruleCooldownAfterCount: 1000000000
      ruleCooldownOnProfileFailure: false
      ruleCooldownMaxSize: 20000
capabilities:
  runtimeDetection: enable
  networkEventsStreaming: disable
  # Top-level prometheusExporter capability gate. Both this and
  # nodeAgent.config.prometheusExporter must be `enable` for the node-agent
  # to bind on port 8080.
  prometheusExporter: enable
alertCRD:
  installDefault: true
  scopeClustered: true
clusterName: bobexample
ksNamespace: honey
excludeNamespaces: "kubescape,kube-system,kube-public,kube-node-lease,local-path-storage,gmp-system,gmp-public,storm,lightening,cert-manager,kube-flannel,ingress-nginx,olm,px-operator,honey,pl,clickhouse"
