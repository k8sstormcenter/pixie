    \  namespace: honey\n  annotations:\n    \n    argocd.argoproj.io/compare-options:\
    \ \"IgnoreExtraneous\"\n    argocd.argoproj.io/sync-options: \"Prune=false\"\n\
    \  labels:\n    helm.sh/chart: kubescape-operator-1.30.2\n    app.kubernetes.io/name:\
    \ kubescape-operator\n    app.kubernetes.io/instance: kubescape\n    app.kubernetes.io/component:\
    \ host-scanner\n    app.kubernetes.io/version: \"1.30.2\"\n    app.kubernetes.io/managed-by:\
    \ Helm\n    app.kubernetes.io/part-of: kubescape\n    app: host-scanner\n    tier:\
    \ ks-control-plane\n    kubescape.io/ignore: \"true\"\nspec:\n  selector:\n  \
    \  matchLabels:\n      app.kubernetes.io/name: kubescape-operator\n      app.kubernetes.io/instance:\
    \ kubescape\n      app.kubernetes.io/component: host-scanner\n  template:\n  \
    \  metadata:\n      annotations:\n        \n        argocd.argoproj.io/compare-options:\
    \ \"IgnoreExtraneous\"\n        argocd.argoproj.io/sync-options: \"Prune=false\"\
    \n      labels:\n        helm.sh/chart: kubescape-operator-1.30.2\n        app.kubernetes.io/name:\
    \ kubescape-operator\n        app.kubernetes.io/instance: kubescape\n        app.kubernetes.io/component:\
    \ host-scanner\n        app.kubernetes.io/version: \"1.30.2\"\n        app.kubernetes.io/managed-by:\
    \ Helm\n        app.kubernetes.io/part-of: kubescape\n        app: host-scanner\n\
    \        tier: ks-control-plane\n        kubescape.io/ignore: \"true\"\n     \
    \   kubescape.io/tier: \"core\"\n        name: host-scanner\n    spec:\n     \
    \ nodeSelector:\n        kubernetes.io/os: linux\n      affinity:\n      tolerations:\n\
    \        - effect: NoSchedule\n          key: node-role.kubernetes.io/control-plane\n\
    \          operator: Exists\n        - effect: NoSchedule\n          key: node-role.kubernetes.io/master\n\
    \          operator: Exists\n      containers:\n      - name: host-sensor\n  \
    \      image: \"quay.io/kubescape/host-scanner:v1.0.78\"\n        imagePullPolicy:\
    \ IfNotPresent\n        securityContext:\n          allowPrivilegeEscalation:\
    \ true\n          privileged: true\n          readOnlyRootFilesystem: true\n \
    \       env:\n        - name: KS_LOGGER_LEVEL\n          value: \"info\"\n   \
    \     - name: KS_LOGGER_NAME\n          value: \"zap\"\n        ports:\n     \
    \     - name: scanner # Do not change port name\n            containerPort: 7888\n\
    \            protocol: TCP\n        resources:\n          limits:\n          \
    \  cpu: 0.4m\n            memory: 400Mi\n          requests:\n            cpu:\
    \ 0.1m\n            memory: 200Mi\n        volumeMounts:\n        - mountPath:\
    \ /host_fs\n          name: host-filesystem\n        startupProbe:\n         \
    \ httpGet:\n            path: /readyz\n            port: 7888\n          failureThreshold:\
    \ 30\n          periodSeconds: 1\n        livenessProbe:\n          httpGet:\n\
    \            path: /healthz\n            port: 7888\n          periodSeconds:\
    \ 10\n      terminationGracePeriodSeconds: 120\n      dnsPolicy: ClusterFirstWithHostNet\n\
    \      serviceAccountName: node-agent\n      automountServiceAccountToken: false\n\
    \      volumes:\n      - hostPath:\n          path: /\n          type: Directory\n\
    \        name: host-filesystem\n      hostPID: true\n      hostIPC: true"
