apiVersion: v1
metadata:
  name: kubescape-cronjob-template
  namespace: honey
  annotations: null
  labels:
    helm.sh/chart: kubescape-operator-1.30.2
    app.kubernetes.io/name: kubescape-operator
    app.kubernetes.io/instance: kubescape
    app.kubernetes.io/component: ks-cloud-config
    app.kubernetes.io/version: 1.30.2
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kubescape
    app: ks-cloud-config
    tier: ks-control-plane
    kubescape.io/ignore: 'true'
    kubescape.io/tier: core
data:
  cronjobTemplate: "apiVersion: batch/v1\nkind: CronJob\nmetadata:\n  name: kubescape-scheduler\n\
    \  namespace: honey\n  labels:\n    app: kubescape-scheduler\n    tier: ks-control-plane\n\
    \    kubescape.io/tier: \"core\"\n    armo.tier: \"kubescape-scan\"\nspec:\n \
    \ schedule: \"0 8 * * *\"\n  successfulJobsHistoryLimit: 3\n  failedJobsHistoryLimit:\
    \ 1\n  jobTemplate:\n    spec:\n      template:\n        metadata:\n         \
    \ labels:\n            armo.tier: \"kubescape-scan\"\n            kubescape.io/tier:\
    \ \"core\"\n        spec:\n          securityContext:\n            seccompProfile:\n\
    \              type: RuntimeDefault\n          containers:\n          - name:\
    \ kubescape-scheduler\n            image: \"quay.io/kubescape/http-request:v0.2.16\"\
    \n            imagePullPolicy: IfNotPresent\n            securityContext:\n  \
    \            allowPrivilegeEscalation: false\n              readOnlyRootFilesystem:\
    \ true\n              runAsNonRoot: true\n              runAsUser: 100\n     \
    \       resources:\n              limits:\n                cpu: 10m\n        \
    \        memory: 20Mi\n              requests:\n                cpu: 1m\n    \
    \            memory: 10Mi\n            args:\n              - -method=post\n \
    \             - -scheme=http\n              - -host=operator:4002\n          \
    \    - -path=v1/triggerAction\n              - -headers=Content-Type:application/json\n\
    \              - -path-body=/home/ks/request-body.json\n            volumeMounts:\n\
    \              - name: \"request-body-volume\"\n                mountPath: /home/ks/request-body.json\n\
    \                subPath: request-body.json\n                readOnly: true\n\
    \          restartPolicy: Never\n          serviceAccountName: kubescape\n   \
    \       automountServiceAccountToken: false\n          nodeSelector:\n       \
    \     kubernetes.io/os: linux\n          affinity:\n          tolerations:\n \
    \         volumes:\n            - name: \"request-body-volume\" # placeholder\n\
    \              configMap:\n                name: kubescape-scheduler"
---
