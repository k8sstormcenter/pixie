---
apiVersion: skaffold/v4beta1
kind: Config
build:
  artifacts:
  - image: operator-operator_image
    context: .
    bazel:
      target: //src/operator:operator_image.tar
  tagPolicy:
    dateTime: {}
manifests:
  kustomize:
    paths:
    - k8s/operator/deployment/base/
profiles:
- name: sbob
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: k8s/operator/deployment/sbob
- name: minikube
  activation:
  - kubeContext: minikube
  patches:
  - op: replace
    path: /build/local
    value:
      push: false
- name: x86_64_sysroot
  patches:
  - op: add
    path: /build/artifacts/context=./bazel/args
    value:
    - --config=x86_64_sysroot
