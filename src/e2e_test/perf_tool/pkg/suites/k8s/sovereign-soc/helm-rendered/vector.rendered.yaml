    app.kubernetes.io/managed-by: Helm
    
automountServiceAccountToken: true
---
# Source: vector/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector
  namespace: "honey"
  labels:
    helm.sh/chart: vector-0.51.0
    app.kubernetes.io/name: vector
    app.kubernetes.io/instance: vector
    app.kubernetes.io/component: Agent
    app.kubernetes.io/version: "0.54.0-distroless-libc"
    app.kubernetes.io/managed-by: Helm
    
data:
  vector.yaml: |
    api:
      address: 127.0.0.1:8686
      enabled: true
      playground: false
    data_dir: /vector-data-dir
    sinks:
      kubescape_clickhouse:
        auth:
          password: pixie_password
          strategy: basic
          user: pixie
        batch:
          max_bytes: 5000000
          timeout_secs: 2
        database: forensic_db
        date_time_best_effort: true
        endpoint: http://clickhouse-forensic-soc-db.clickhouse.svc.cluster.local:8123
        inputs:
        - kubescape_enrich
        skip_unknown_fields: true
        table: kubescape_logs
        type: clickhouse
      kubescape_debug:
        encoding:
          codec: json
        inputs:
        - kubescape_enrich
        path: /tmp/kubescape.json
        type: file
    sources:
      kubescape_nodeagent_logs:
        extra_label_selector: app=node-agent
        type: kubernetes_logs
    transforms:
      kubescape_enrich:
        inputs:
        - kubescape_filter
        source: |
          .CloudMetadata = "empty"
          .hostname = get_env_var!("NODE_NAME")
          .event_time = to_unix_timestamp(now(), "nanoseconds")
          del(.time)
        type: remap
      kubescape_filter:
        condition: .BaseRuntimeMetadata != null
        inputs:
        - kubescape_parse
        type: filter
      kubescape_parse:
        inputs:
        - kubescape_nodeagent_logs
        source: |
          . = parse_json!(.message)
        type: remap
