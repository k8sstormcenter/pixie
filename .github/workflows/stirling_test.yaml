---
name: stirling-test
run-name: ${{ inputs.config || 'clang' }} ${{ inputs.ref || github.ref_name }}
on:
  push:
    branches:
    - 'ci/stirling-tests'
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to test"
        required: true
        type: string
      targets:
        description: "Space separated list of bazel test targets"
        required: true
        type: string
      config:
        description: "Bazel config to test with"
        required: true
        type: choice
        default: clang
        options:
        - clang
        - qemu-bpf
        - bpf
      kernel:
        description: "Kernel version for the qemu-bpf config"
        required: false
        default: '6.8.12'
        type: string
      args:
        description: "Extra bazel flags"
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      ref:
        required: false
        default: ''
        type: string
      targets:
        required: true
        type: string
      config:
        required: true
        type: string
      kernel:
        required: false
        default: '6.8.12'
        type: string
      args:
        required: false
        default: ''
        type: string
      label:
        description: "Suffix that keeps artifact names unique within one run"
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  get-dev-image:
    uses: ./.github/workflows/get_image.yaml
    with:
      image-base-name: "dev_image_with_extras"
      ref: ${{ inputs.ref }}
  test:
    runs-on: oracle-vm-16cpu-64gb-x86-64
    needs: get-dev-image
    timeout-minutes: 240
    container:
      image: ${{ needs.get-dev-image.outputs.image-with-tag }}
      options: --privileged
    env:
      CONFIG: ${{ inputs.config || 'clang' }}
      KERNEL: ${{ inputs.kernel || '6.8.12' }}
      TARGETS: >-
        ${{ inputs.targets
        || '//src/stirling/source_connectors/socket_tracer/protocols/kafka:parse_test' }}
      EXTRA_ARGS: ${{ inputs.args }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        ref: ${{ inputs.ref }}
    - name: Add pwd to git safe dir
      run: git config --global --add safe.directory `pwd`
    - name: get bazel config
      uses: ./.github/actions/bazelrc
      with:
        dev: 'false'
        BB_API_KEY: ${{ secrets.BB_IO_API_KEY }}
    - name: Test
      shell: bash
      run: |
        # Github actions container runner creates a docker network without IPv6 support. We enable it manually.
        sysctl -w net.ipv6.conf.lo.disable_ipv6=0

        bazel_args=("--config=${CONFIG}" "--compilation_mode=opt" "--local_ram_resources=28000")
        bazel_args+=("--test_output=errors")
        if [[ "${CONFIG}" == "qemu-bpf" ]]; then
          # Our qemu builds require unprivileged user namespaces to run.
          sysctl -w kernel.unprivileged_userns_clone=1
          sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bazel_args+=("--//bazel/test_runners/qemu_with_kernel:kernel_version=${KERNEL}")
        fi
        read -r -a extra_args <<< "${EXTRA_ARGS}"
        read -r -a targets <<< "${TARGETS}"
        ./scripts/bazel_ignore_codes.sh test "${bazel_args[@]}" "${extra_args[@]}" -- "${targets[@]}" \
          2> >(tee bazel_stderr) | tee bazel_output
    - name: Results
      if: always()
      shell: bash
      run: |
        touch bazel_output
        sed 's/\x1b\[[0-9;]*m//g' bazel_output \
          | grep -aE '^//[^ ]+ .*(PASSED|FAILED|FLAKY|TIMEOUT|NO STATUS)' \
          | sed "s|^|${CONFIG} ${KERNEL} |" > results.txt || true
        [[ -s results.txt ]] || echo "${CONFIG} ${KERNEL} ${TARGETS} NO RESULT" > results.txt
        tee -a "${GITHUB_STEP_SUMMARY}" < results.txt
    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      with:
        name: testlogs${{ inputs.label && format('-{0}', inputs.label) || '' }}
        path: |
          results.txt
          bazel-testlogs/**/test.log
          bazel-testlogs/**/test.xml
        if-no-files-found: ignore
    - name: Buildbuddy URL
      if: always()
      run: |
        [[ -f bazel_stderr ]] || (echo "Error before bazel ran" && exit 1)
        bb_url="$(cat bazel_stderr | grep -Po "(?<=Streaming build results to: ).*" | tail -n 1)"
        echo "${bb_url}"
      shell: bash
