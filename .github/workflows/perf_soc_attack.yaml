---
name: perf-eval-soc-attack
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit'
        required: false
        type: string
      tags:
        description: 'Tags (comma separated)'
        required: false
        type: string
      cloud_addr:
        description: 'Pixie cloud address (host:port)'
        required: false
        default: 'pixie.austrianopencloudcommunity.org:443'
        type: string
      ado_action:
        description: >
          Pre-test action against the SovereignSOC edge-cluster pipeline.
          'skip' = no ADO call (default; perf runs against the existing
          KUBECONFIG_B64 cluster). 'plan' = dry-run the ADO pipeline
          (validates GH→ADO trigger without changing infra).
          'reset'/'create' = mutating; only use once the kubeconfig
          export from edge-cluster.yml lands (see SovereignSOC
          docs/triggering-pipelines-from-github.md §C).
        required: false
        default: 'skip'
        type: choice
        options:
          - skip
          - plan
          - reset
          - create
      ado_cluster:
        description: 'Edge cluster slot (only used when ado_action != skip)'
        required: false
        default: 'edge4'
        type: choice
        options:
          - edge4
          - k3s-1
          - k3s-2
          - rocky-1
      ado_branch:
        description: >
          SovereignSOC ref the ADO pipeline definition should resolve from.
          Use the branch the pipeline YAML lives on, NOT a perf branch.
          Defaults to refs/heads/refactor/edge-slots (the active working
          branch until it lands on main).
        required: false
        default: 'refs/heads/refactor/edge-slots'
        type: string
permissions:
  contents: read
  packages: write
jobs:
  # ── GH→ADO trigger smoke step ─────────────────────────────────────────
  # Fires the SovereignSOC edge-cluster pipeline before the perf test runs.
  # Skipped by default (ado_action=skip) so the existing prod-targeted
  # path keeps working. Set ado_action=plan to smoke-test the trigger
  # path without infra mutation.
  ado-trigger:
    if: ${{ inputs.ado_action != 'skip' }}
    runs-on: ubuntu-latest
    steps:
      - id: ado
        uses: k8sstormcenter/actions/trigger-ado-pipeline@main
        with:
          org:         ${{ vars.ADO_ORG }}
          project:     ${{ vars.ADO_PROJECT }}
          pipeline_id: ${{ vars.ADO_PIPELINE_EDGE }}
          pat:         ${{ secrets.ADO_PAT }}
          cluster:     ${{ inputs.ado_cluster }}
          action:      ${{ inputs.ado_action }}
          os:          'ubuntu'
          branch:      ${{ inputs.ado_branch }}
          wait:        'true'
          timeout:     '1800'
      - name: Summary
        if: always()
        run: |
          {
            echo "### ADO trigger"
            echo "- pipeline: \`edge-cluster\`"
            echo "- cluster:  \`${{ inputs.ado_cluster }}\`"
            echo "- action:   \`${{ inputs.ado_action }}\`"
            echo "- run url:  ${{ steps.ado.outputs.run_url }}"
            echo "- result:   ${{ steps.ado.outputs.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

  get-dev-image-with-extras:
    uses: ./.github/workflows/get_image.yaml
    with:
      image-base-name: "dev_image_with_extras"
      ref: ${{ inputs.ref }}

  soc-attack-perf:
    name: Sovereign SOC redis-attack perf eval
    # When ado_action != skip, wait for the ADO trigger to finish first.
    # `always()` ensures the job still runs when ado-trigger is skipped.
    needs:
      - get-dev-image-with-extras
      - ado-trigger
    if: ${{ always() && needs.get-dev-image-with-extras.result == 'success' && (needs.ado-trigger.result == 'success' || needs.ado-trigger.result == 'skipped') }}
    runs-on: oracle-vm-16cpu-64gb-x86-64
    container:
      image: ${{ needs.get-dev-image-with-extras.outputs.image-with-tag }}
      options: --cap-add=NET_ADMIN --device=/dev/net/tun
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0
    - name: Add pwd to git safe dir
      run: git config --global --add safe.directory `pwd`
    - id: get-commit-sha
      run: echo "commit-sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # TODO(ddelnano): swap TAILSCALE_AUTH_KEY for an OAuth client once one is
    # provisioned in the k8sstormcenter tailnet. Use
    # `tailscale/github-action@v2` with `oauth-client-id` and `oauth-secret`
    # inputs (`TS_OAUTH_CLIENT_ID` / `TS_OAUTH_CLIENT_SECRET` secrets) so
    # credentials rotate automatically instead of expiring on a fixed cadence.
    - name: Start Tailscale sidecar
      env:
        TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh
        mkdir -p /var/run/tailscale /var/lib/tailscale
        tailscaled \
          --socket=/var/run/tailscale/tailscaled.sock \
          --state=/var/lib/tailscale/tailscaled.state &
        until tailscale status --json >/dev/null 2>&1; do sleep 1; done
        tailscale up \
          --authkey="${TS_AUTHKEY}" \
          --accept-routes \
          --hostname="pixie-perf-ci-${GITHUB_RUN_ID}"

    - name: Write kubeconfig
      env:
        KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
      run: |
        mkdir -p "${RUNNER_TEMP}"
        echo "${KUBECONFIG_B64}" | base64 -d > "${RUNNER_TEMP}/kubeconfig"
        chmod 600 "${RUNNER_TEMP}/kubeconfig"

    # Fail fast if Tailscale can't reach the cluster API, before the 2+ minute
    # bazel/skaffold build wastes time.
    - name: Tailscale connectivity probe
      env:
        KUBECONFIG: ${{ runner.temp }}/kubeconfig
      run: |
        tailscale status
        tailscale netcheck
        api_host="$(kubectl --kubeconfig="$KUBECONFIG" config view --minify \
          -o jsonpath='{.clusters[0].cluster.server}' \
          | sed -E 's|https?://||; s|/.*||')"
        api_ip="${api_host%%:*}"
        api_port="${api_host##*:}"
        echo "--- tailscale ping ${api_ip} ---"
        tailscale ping --c 3 --until-direct=false "${api_ip}" || true
        echo "--- tcp probe ${api_ip}:${api_port} ---"
        timeout 5 bash -c "</dev/tcp/${api_ip}/${api_port}" \
          && echo "API port reachable" \
          || { echo "API port UNREACHABLE"; exit 1; }
        echo "--- kubectl get nodes ---"
        kubectl --kubeconfig="$KUBECONFIG" get nodes

    - name: Use github bazel config
      uses: ./.github/actions/bazelrc
      with:
        download_toplevel: 'true'
        BB_API_KEY: ${{ secrets.BB_IO_API_KEY }}

    # TODO(ddelnano): revert to `./.github/actions/gcloud_creds` once GCP_SA_KEY
    # is re-uploaded with `base64 -w0`. The shared composite uses plain
    # `base64 --decode` which rejects the wrapped (multi-line/CRLF) value
    # currently stored in the secret.
    - id: gcloud-creds
      env:
        SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SA_KEY }}
      run: |
        printf '%s' "$SERVICE_ACCOUNT_KEY" | base64 -di > /tmp/gcloud.json
        chmod 600 /tmp/gcloud.json
        echo "gcloud-creds=/tmp/gcloud.json" >> $GITHUB_OUTPUT
    - name: Activate gcloud service account
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcloud-creds.outputs.gcloud-creds }}
      run: |
        service_account="$(jq -r '.client_email' "$GOOGLE_APPLICATION_CREDENTIALS")"
        gcloud auth activate-service-account "${service_account}" --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
        gcloud auth configure-docker

    - name: Log in to GHCR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Build and install px CLI
      run: |
        bazel build --config=x86_64_sysroot //src/pixie_cli:px
        install -m 0755 bazel-bin/src/pixie_cli/px_/px /usr/local/bin/px
        px version

    # Deploy Vizier via manifest-apply (NOT `px deploy` directly).
    #
    # `px deploy` has a bug where the Subscription apply step prints ✔ but
    # the object never lands in k8s, so the operator never reconciles the
    # Vizier CR and the deploy times out at "cluster ID assignment".
    # Diagnosed in biz/iximiuz/MAKEFILE 2026-05-25; same pattern applied
    # here so SOC_VIZIER_EXISTING=1 (used below) finds a healthy vizier
    # on every cluster including fresh edge4 resets via the ADO trigger
    # path.
    #
    # Use px ONLY to generate the yamls (--extract_yaml) and kubectl-apply
    # them in numeric order, waiting at each phase. Idempotent — short-
    # circuits when vizier-cloud-connector is already Available.
    - name: Deploy Vizier (manifest-apply, idempotent)
      env:
        PX_API_KEY:      ${{ secrets.PX_API_KEY }}
        PX_DEPLOY_KEY:   ${{ secrets.PX_DEPLOY_KEY }}
        PX_CLOUD_ADDR:   ${{ inputs.cloud_addr }}
        KUBECONFIG:      ${{ runner.temp }}/kubeconfig
      # Container default shell is /bin/sh (dash) — no `set -o pipefail`.
      shell: bash
      run: |
        set -euo pipefail

        if kubectl get ns pl >/dev/null 2>&1 \
           && kubectl -n pl get deploy vizier-cloud-connector >/dev/null 2>&1 \
           && kubectl -n pl rollout status deploy/vizier-cloud-connector --timeout=1s >/dev/null 2>&1; then
          echo "__VIZIER_ALREADY_HEALTHY__"
          exit 0
        fi

        echo "STEP_1_AUTH"
        px auth login --use_api_key --api_key "$PX_API_KEY" -y >/dev/null

        # PX_DEPLOY_KEY is optional in CI — fall back to runtime creation when
        # the repo doesn't have it as a secret (the pixie repo only sets
        # PX_API_KEY by convention). `px deploy-key create` mints a one-shot
        # deploy key bound to the authenticated user / org, which is plenty
        # for an ephemeral perf run.
        if [[ -z "${PX_DEPLOY_KEY:-}" ]]; then
          echo "PX_DEPLOY_KEY unset — creating an ephemeral deploy key"
          PX_DEPLOY_KEY=$(px deploy-key create -o json 2>/dev/null \
            | jq -r '.key // .deploy_key // .DeployKey // empty')
          if [[ -z "$PX_DEPLOY_KEY" ]]; then
            echo "deploy-key create returned empty — fallback YAML:" >&2
            px deploy-key create -o yaml 2>&1 | head -10 >&2
            exit 1
          fi
        fi

        echo "STEP_2_EXTRACT_YAMLS"
        rm -rf /tmp/px-yaml && mkdir -p /tmp/px-yaml
        px deploy --deploy_key "$PX_DEPLOY_KEY" --extract_yaml /tmp/px-yaml >/dev/null
        tar -xf /tmp/px-yaml/yamls.tar -C /tmp/px-yaml/
        YAML_DIR=/tmp/px-yaml/pixie_yamls
        [[ -d "$YAML_DIR" ]] || { echo "EXTRACT_FAILED no $YAML_DIR"; exit 1; }

        echo "STEP_3_APPLY_CRDS"
        # --server-side avoids the 256KB last-applied-configuration annotation
        # limit on the OLM CRDs (clusterserviceversions.yaml schema is ~250KB).
        kubectl apply --server-side --force-conflicts -f "$YAML_DIR/00_olm_crd.yaml"
        kubectl apply --server-side --force-conflicts -f "$YAML_DIR/01_vizier_crd.yaml"
        kubectl wait --for=condition=Established --timeout=60s \
          crd/clusterserviceversions.operators.coreos.com \
          crd/catalogsources.operators.coreos.com \
          crd/subscriptions.operators.coreos.com \
          crd/installplans.operators.coreos.com \
          crd/operatorgroups.operators.coreos.com \
          crd/viziers.px.dev >/dev/null

        echo "STEP_4_APPLY_OLM"
        kubectl apply -f "$YAML_DIR/02_olm.yaml"
        kubectl -n olm rollout status deploy/olm-operator     --timeout=180s >/dev/null
        kubectl -n olm rollout status deploy/catalog-operator --timeout=180s >/dev/null

        echo "STEP_5_APPLY_OPERATOR_BUNDLE"
        kubectl apply -f "$YAML_DIR/03_px_olm.yaml"
        kubectl apply -f "$YAML_DIR/04_catalog.yaml"
        kubectl apply -f "$YAML_DIR/05_subscription.yaml"

        echo "STEP_6_WAIT_CSV"
        PHASE=""
        for i in $(seq 1 36); do
          PHASE=$(kubectl -n px-operator get csv -o jsonpath='{.items[0].status.phase}' 2>/dev/null || true)
          [[ "$PHASE" == "Succeeded" ]] && break
          sleep 5
        done
        [[ "$PHASE" == "Succeeded" ]] || { echo "OPERATOR_CSV_NOT_SUCCEEDED phase=$PHASE"; exit 1; }

        echo "STEP_7_APPLY_VIZIER"
        # The extracted yamls don't include the pl namespace creation —
        # the original `px deploy` did it implicitly before applying the CR.
        kubectl create ns pl 2>/dev/null || true
        kubectl apply -f "$YAML_DIR/06_vizier.yaml"

        echo "STEP_8_WAIT_VIZIER_HEALTHY"
        # cloud-connector is the last Pod up in the vizier set; once Available,
        # SOC_VIZIER_EXISTING=1 below will find a usable cluster.
        for i in $(seq 1 60); do
          if kubectl -n pl get deploy vizier-cloud-connector >/dev/null 2>&1 \
             && kubectl -n pl rollout status deploy/vizier-cloud-connector --timeout=5s >/dev/null 2>&1; then
            echo "__VIZIER_DEPLOYED__"
            exit 0
          fi
          sleep 10
        done
        echo "VIZIER_NEVER_BECAME_AVAILABLE (10min)"
        kubectl -n pl get pods
        exit 1

    # The sovereign-soc suite installs Kubescape + Vector on the experiment
    # cluster as part of the run (see KubescapeVectorWorkload). The
    # kubescape-operator chart is pre-rendered under
    # src/e2e_test/perf_tool/pkg/suites/k8s/sovereign-soc/helm-rendered/
    # and applied via PrerenderedDeploy, so no extra ./scripts step is needed.
    #
    # ClickHouse operator metrics are scraped on the forensic cluster via
    # the prom_recorder_override; the kubescape node-agent prom recorder
    # is intentionally NOT overridden — kubescape runs on the experiment
    # cluster (where redis+bobctl drive traffic), so the recorder uses the
    # default kubeconfig.
    - name: Run sovereign-soc redis-attack perf
      env:
        PX_API_KEY: ${{ secrets.PX_API_KEY }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.gcloud-creds.outputs.gcloud-creds }}
        KUBECONFIG: ${{ runner.temp }}/kubeconfig
        SOC_VIZIER_EXISTING: "1"
      run: |
        bazel run //src/e2e_test/perf_tool:perf_tool -- run \
          --api_key="${PX_API_KEY}" \
          --cloud_addr="${{ inputs.cloud_addr }}" \
          --commit_sha="${{ steps.get-commit-sha.outputs.commit-sha }}" \
          --experiment_name=redis-attack-4x \
          --suite=sovereign-soc \
          --use_local_cluster \
          --export_backend=parquet-gcs \
          --gcs_bucket=k8sstormcenter-soc-perf \
          --container_repo=ghcr.io/k8sstormcenter \
          --prom_recorder_override 'clickhouse-operator=:k8ss-forensic' \
          --max_retries=1 \
          --tags "${{ inputs.tags }}"

    - name: Tailscale logout
      if: always()
      run: tailscale logout || true
