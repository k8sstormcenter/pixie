# Skaffold config for the adaptive_export load-test data plane (matches the
# vzconn_loadtest pattern). Two images: cleanloadgen (the generator pod's
# entry binary) and httpsink (the silent 200-OK terminator that anchors the
# counted HTTP requests).
apiVersion: skaffold/v4beta1
kind: Config
build:
  artifacts:
  - image: gcr.io/pixie-oss/pixie-dev/src/e2e_test/adaptive_export_loadtest/cleanloadgen_image
    context: .
    bazel:
      target: //src/e2e_test/adaptive_export_loadtest/tools/loadgen/cmd/cleanloadgen:cleanloadgen_image.tar
  - image: gcr.io/pixie-oss/pixie-dev/src/e2e_test/adaptive_export_loadtest/httpsink_image
    context: .
    bazel:
      target: //src/e2e_test/adaptive_export_loadtest/tools/loadgen/cmd/httpsink:httpsink_image.tar
  tagPolicy:
    dateTime: {}
manifests:
  kustomize:
    paths:
    - src/e2e_test/adaptive_export_loadtest/k8s
