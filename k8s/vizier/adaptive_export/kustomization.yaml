---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pl
# Everything adaptive-export needs lives in this directory. It used to reach back into
# ../bootstrap, which meant the same two files were rendered by two kustomizations: this
# one and the vizier bootstrap. The two applied different commonLabels, so the Service
# selector written by one did not match the pods written by the other, and a deploy on top
# of a vizier-installed AE left adaptive-export-control with no endpoints at all — dx's
# hand-off silently going nowhere. One definition, one label set, no divergence possible.
# The pl-adaptive-export-secrets secret is NOT a resource here. It is created by the
# before-deploy hook in skaffold/skaffold_export.yaml, which seeds it only when a key is
# supplied and otherwise leaves a live secret untouched. There used to be a second
# definition of the same secret in this directory (secrets.example.yaml); whenever it was
# applied it clobbered the real pixie-api-key with its placeholder, which is the recurring
# "AE unauthenticated / writes 0" bug. One definition, in the installer. See README.md.
resources:
- rbac.yaml
- daemonset.yaml
images:
- name: vizier-adaptive_export_image
  newName: docker.io/tanzeee/adaptive-export
  newTag: 0.16.50-6dc818c
