              guid:
                type: string
              commandType:
                type: string
              commandVersion:
                type: string
                nullable: true
              designators:
                type: array
                items:
                  type: object
                  additionalProperties: true
              body:
                type: string
                format: byte
                nullable: true
              ttl:
                type: string
                format: duration
                nullable: true
              args:
                type: object
                additionalProperties: true
                nullable: true
              commandIndex:
                type: integer
                nullable: true
              commandCount:
                type: integer
                nullable: true
          status:
            type: object
            properties:
              started:
                type: boolean
              startedAt:
                type: string
                format: date-time
                nullable: true
              completed:
                type: boolean
              completedAt:
                type: string
                format: date-time
                nullable: true
              executer:
                type: string
                nullable: true
              error:
                type: object
                nullable: true
                properties:
                  reason:
                    type: string
                    nullable: true
                  message:
                    type: string
                    nullable: true
                  errorCode:
                    type: integer
                    nullable: true
              payload:
                type: string
                format: byte
                nullable: true
    subresources:
      status: {}
