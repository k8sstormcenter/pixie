---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pl-adaptive-export-service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pl-adaptive-export-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
# Leader election among the AE pods: main.go lists pods in ITS OWN namespace by the
# name=adaptive-export label. Namespaced, so it belongs here and not in a ClusterRole.
# Losing this grant does not crash AE — the list falls back to "proceed as leader", which
# means every pod believes it leads. Quietly worse than failing.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pl-adaptive-export-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pl-adaptive-export-role
subjects:
- kind: ServiceAccount
  name: pl-adaptive-export-service-account
  namespace: pl
