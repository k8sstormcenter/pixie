---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server
  namespace: px-protocol-loadtest
  labels:
    name: http-server
spec:
  replicas: 1
  selector:
    matchLabels:
      name: http-server
  template:
    metadata:
      labels:
        name: http-server
        kubescape.io/user-defined-profile: http-server-empty
    spec:
      containers:
      - name: app
        image: docker.io/library/protocol_loadtest_server:latest
        imagePullPolicy: IfNotPresent
        env:
        - {name: HTTP_PORT,     value: "8080"}
        - {name: HTTP_SSL_PORT, value: "8081"}
        - {name: GRPC_PORT,     value: "9080"}
        - {name: GRPC_SSL_PORT, value: "9081"}
        ports:
        - {name: http,  containerPort: 8080}
        - {name: https, containerPort: 8081}
        - {name: grpc,  containerPort: 9080}
        - {name: grpcs, containerPort: 9081}
        resources:
          requests: {cpu: "200m", memory: "128Mi"}
          limits:   {cpu: "4",    memory: "2Gi"}
        readinessProbe:
          tcpSocket: {port: http}
          initialDelaySeconds: 2
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: http-server
  namespace: px-protocol-loadtest
spec:
  selector:
    name: http-server
  ports:
  - {name: http,  port: 8080, targetPort: http}
  - {name: https, port: 8081, targetPort: https}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-client
  namespace: px-protocol-loadtest
  labels:
    name: http-client
spec:
  replicas: 1
  selector:
    matchLabels:
      name: http-client
  template:
    metadata:
      labels:
        name: http-client
        kubescape.io/user-defined-profile: http-client-empty
    spec:
      initContainers:
      - name: wait-server
        image: ghcr.io/pixie-io/pixie-oss-pixie-dev-public-curl:8.15.0@sha256:4026b29997dc7c823b51c164b71e2b51e0fd95cce4601f78202c513d97da2922
        command:
        - sh
        - -c
        - |
          for i in $(seq 1 180); do
            curl -m 0.5 -s -o /dev/null -X POST -H "Content-Type: application/json" --data "{}" http://http-server:8080/ && exit 0
            echo waiting
            sleep 1
          done
          echo "http-server did not become ready in time"
          exit 1
      containers:
      - name: client
        image: docker.io/library/protocol_loadtest_client:latest
        imagePullPolicy: IfNotPresent
        env:
        - {name: HTTP_HOST,       value: "http-server"}
        - {name: HTTP_PORT,       value: "8080"}
        - {name: HTTP_PATH,       value: "/"}
        - {name: NUM_CONNECTIONS, value: "10"}
        - {name: TARGET_RPS,      value: "1000"}
        - {name: NUM_MESSAGES,    value: "5000"}
        - {name: REQ_SIZE,        value: "256"}
        - {name: RESP_SIZE,       value: "256"}
        resources:
          requests: {cpu: "200m", memory: "128Mi"}
          limits:   {cpu: "4",    memory: "1Gi"}
