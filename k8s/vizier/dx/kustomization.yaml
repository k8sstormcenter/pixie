---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: honey
resources:
- dx-daemon.yaml
# Set locally to the image you deploy; not carried in this repository:
#   cd k8s/vizier/dx
#   kustomize edit set image dx-daemon_image=<ref>:<version>
images:
- name: dx-daemon_image
  newName: DX_DAEMON_IMAGE
  newTag: latest
