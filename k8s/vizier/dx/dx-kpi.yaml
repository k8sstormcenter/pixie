apiVersion: v1
kind: ServiceAccount
metadata: { name: dx-kpi, namespace: honey }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: dx-kpi }
rules:
- apiGroups: [""]
  resources: [nodes, pods, services]
  verbs: [list, get]
- apiGroups: [cilium.io]
  resources: [ciliumnodes]
  verbs: [list, get]
- apiGroups: [spdx.softwarecomposition.kubescape.io]
  resources: [containerprofiles, rogueartifacts]
  verbs: [list, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: dx-kpi }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: dx-kpi }
subjects:
- { kind: ServiceAccount, name: dx-kpi, namespace: honey }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: dx-kpi, namespace: honey }
rules:
- apiGroups: [apps]
  resources: [daemonsets]
  verbs: [get]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: dx-kpi, namespace: honey }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: dx-kpi }
subjects:
- { kind: ServiceAccount, name: dx-kpi, namespace: honey }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dx-kpi
  namespace: honey
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        spec:
          serviceAccountName: dx-kpi
          restartPolicy: Never
          containers:
          - name: dx-kpi
            image: docker.io/entlein/dx-daemon:0.5.0-keepset-rc23
            args: ["kpi"]
            env:
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: DX_CLUSTER, valueFrom: { configMapKeyRef: { name: dx-kpi, key: cluster, optional: true } } }
            - { name: DX_KPI_ORACLE, valueFrom: { configMapKeyRef: { name: dx-kpi, key: oracle, optional: true } } }
            - { name: DX_KPI_WINDOW_S, value: "3600" }
            - { name: DX_ORDERS_CH, value: "http://ingest_writer:changeme-ingest@clickhouse-forensic-soc-db.clickhouse.svc.cluster.local:8123/forensic_db" }
            resources:
              requests: { cpu: 50m, memory: 128Mi }
              limits:   { cpu: "1", memory: 1Gi }
