---
# Fast single-VM bring-up of the DETECTION path (no cloud, no k8s). Host network
# so dx reaches the PEM on 127.0.0.1:12345 and the injector reaches dx :9099.
services:
  standalone-pem:
    image: ghcr.io/k8sstormcenter/vizier-standalone_pem_image:0.14.18-dxpoc3
    network_mode: host
    pid: host
    privileged: true
    environment:
      PX_STANDALONE_PEM_PORT: "12345"
      PL_TABLE_STORE_DATA_LIMIT_MB: "1024"
      PL_HOST_PATH: /host
    volumes:
    - /:/host:ro
    - /sys:/sys:rw
  dx-daemon:
    image: docker.io/entlein/dx-daemon:0.3.0-integration4
    network_mode: host
    depends_on:
    - standalone-pem
    environment:
      DX_PORT: "9099"
      DX_METRICS_PORT: "9095"
      DX_BENCH: pxdirect
      PX_DIRECT_ADDR: 127.0.0.1:12345
      DX_CATALOG_DIR: /etc/dx/catalog
    volumes:
    - ./catalog:/etc/dx/catalog:ro
