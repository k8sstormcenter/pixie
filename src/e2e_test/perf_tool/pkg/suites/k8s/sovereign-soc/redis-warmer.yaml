# redis-warmer — generates ambient RESP traffic to the redis Service so
# Pixie's stirling registers the redis_events table in Vizier's schema.
#
# Without this, the sovereign-soc experiment's ClickHouseExportLoadMetric
# fails at PxL compile time with:
#   Compilation failed: 31:18 Table 'redis_events' not found
# because Pixie's PEM only adds a protocol-events table to the schema
# after observing at least one packet of that protocol.
#
# Design:
#  - Separate pod (NOT an initContainer on redis-vulnerable) so the
#    traffic crosses the pod-to-pod boundary on the node's network
#    namespace, where stirling's eBPF probes can see it.
#  - Image: redis:7-alpine — pinned, contains redis-cli, ~30 MB pull
#    once on first deploy.
#  - PING every 2 s. Negligible load, keeps the table alive across
#    Pixie's 60 s table-aging window.
#  - Deployment (1 replica) instead of Job so it stays up across the
#    entire experiment duration, including BURNIN and RUN phases.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-warmer
  namespace: redis
  labels:
    app.kubernetes.io/name: redis-warmer
    app.kubernetes.io/part-of: sovereign-soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-warmer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-warmer
        # Tag this so Vector's filter rules can drop these alerts if
        # the analyst wants to exclude warmer traffic from
        # forensic_db.alerts.
        kubescape.io/ignore: "true"
    spec:
      containers:
      - name: redis-warmer
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          # Tight retry loop until the redis Service is resolvable —
          # the warmer can start before redis-vulnerable's pod is
          # Ready (Deployment ordering is parallel by default).
          until redis-cli -h redis -p 6379 -t 2 PING >/dev/null 2>&1; do
            echo "waiting for redis service..."
            sleep 1
          done
          echo "redis reachable, beginning warm loop"
          while true; do
            redis-cli -h redis -p 6379 -t 2 PING >/dev/null || true
            sleep 2
          done
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 50m
            memory: 32Mi
