[mypy]
# Bumped 2026-05-18 from 3.8 → 3.10 because mypy 1.20+ dropped 3.8 support
# (CI's arc-lint container surfaced "Python 3.8 is not supported (must be
# 3.9 or higher)") and mypy 2.x raises that floor again to 3.10. 3.10 keeps
# us compatible with both 1.20.x and 2.x without re-bumping. Any new syntax
# below 3.10 still parses; we just lose 3.8/3.9 inference support — fine
# because we don't run our Python tooling on those interpreters anyway.
python_version = 3.10
show_column_numbers = True
show_error_context = False

# suppress errors about unsatisfied imports
ignore_missing_imports = True

# allow untyped calls as a consequence of the options above
disallow_untyped_calls = False

# allow returning Any as a consequence of the options above
warn_return_any = False

# treat Optional per PEP 484
strict_optional = True

# ensure all execution paths are returning
warn_no_return = True

# lint-style cleanliness for typing needs to be disabled; returns more errors
# than the full run.
warn_redundant_casts = False
warn_unused_ignores = False

# The following are off by default since they're too noisy.
# Flip them on if you feel adventurous.
disallow_untyped_defs = False
check_untyped_defs = False
