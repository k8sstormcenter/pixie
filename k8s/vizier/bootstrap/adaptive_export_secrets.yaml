# SEED-ONLY template — NOT in kustomization.yaml (separation of concerns).
# Real credentials are written by `make ae-auth` (pixie-api-key from keys.env,
# clickhouse-dsn = the fixed forensic-CH constant). Do NOT add this back to the
# bundle: a re-apply would clobber the real pixie-api-key with the placeholder
# (the recurring "AE unauthenticated / writes 0" bug). Apply this by hand ONLY
# to seed a brand-new cluster so the AE pod's secretKeyRef resolves before
# ae-auth runs.
---
apiVersion: v1
kind: Secret
metadata:
  name: pl-adaptive-export-secrets
type: Opaque
stringData:
  # Replace with your actual Pixie API key from https://work.withpixie.ai
  pixie-api-key: "PIXIE_API_KEY_PLACEHOLDER"
  # ClickHouse DSN matches soc/tree/clickhouse-lab (CHI "forensic-soc-db",
  # ingest_writer user with INSERT rights into the forensic_db database).
  # Format: user:password@host:port/database
  clickhouse-dsn: >-
    ingest_writer:changeme-ingest@clickhouse-forensic-soc-db.clickhouse.svc.cluster.local:9000/forensic_db
