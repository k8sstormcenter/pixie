---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adaptive-export
spec:
  replicas: 0
  selector:
    matchLabels:
      name: adaptive-export
  template:
    metadata:
      labels:
        name: adaptive-export
        plane: control
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            # The beta.kubernetes.io/os label has been deprecated since
            # k8s v1.14; every modern kubelet sets kubernetes.io/os. The
            # single term below is enough — kept both ORed terms in the
            # past for pre-1.14 compatibility.
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      serviceAccountName: pl-adaptive-export-service-account
      containers:
      - name: adaptive-export
        image: vizier-adaptive_export_image:latest
        env:
        - name: PL_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: PIXIE_API_KEY
          valueFrom:
            secretKeyRef:
              name: pl-adaptive-export-secrets
              key: pixie-api-key
        - name: CLICKHOUSE_DSN
          valueFrom:
            secretKeyRef:
              name: pl-adaptive-export-secrets
              key: clickhouse-dsn
        - name: VERBOSE
          value: "true"
        - name: DETECTION_INTERVAL_SEC
          value: "10"
        - name: DETECTION_LOOKBACK_SEC
          value: "30"
        # EXPORT_MODE controls the reconcile behaviour:
        #   auto    - detection drives on/off (default)
        #   always  - plugin always enabled (bypass detection)
        #   never   - plugin always disabled and ch-* scripts purged
        - name: EXPORT_MODE
          value: "auto"
        # Number of consecutive empty detection ticks before auto-disable fires.
        - name: EXPORT_QUIET_TICKS
          value: "6"
        # Optional overrides for the ClickHouse PxL scripts. When unset they are
        # parsed from CLICKHOUSE_DSN. Individual fields win over the parsed DSN.
        # Defaults below match soc/tree/clickhouse-lab (forensic-soc-db CHI,
        # ingest_writer user, forensic_db database).
        - name: KUBESCAPE_TABLE
          value: "kubescape_logs"
        # ─── pushPixieRows fan-out throttle knobs ──────────────────────────
        # All default to 0 (= legacy unbounded behavior) inside the binary.
        # The values below are the "production-safe" defaults established by
        # the 4× sweep evaluation (proto-sweep results 2026-05-17):
        # baseline (no throttle) → 0 rows / 85 fan-outs / broker overloaded.
        # this combo (per_hash=2 + global=10 + empty_skip) → 80k rows / same
        # fan-out count, ≥10× throughput vs baseline.
        #
        # Tune-down rationale: counterintuitive but verified — TIGHTER caps
        # produce HIGHER throughput because vizier-query-broker is the
        # bottleneck, not the operator. Fewer concurrent PxL queries → each
        # finishes faster → more queries total per unit time. Set higher
        # values (or 0) only if the broker has been resized.
        - name: ADAPTIVE_MAX_PARALLEL_QUERIES_PER_HASH
          value: "2"
        - name: ADAPTIVE_MAX_INFLIGHT_QUERIES_GLOBAL
          value: "10"
        # Negative cache: after N consecutive 0-row returns for (pod, table),
        # skip that pair for TTL seconds. Eliminates the "ask http_events for
        # a redis pod" waste. Self-heals when a pod newly starts a protocol
        # (worst case = TTL seconds of missed data).
        - name: ADAPTIVE_EMPTY_RESULT_SKIP_AFTER_N
          value: "3"
        - name: ADAPTIVE_EMPTY_RESULT_SKIP_TTL_SEC
          value: "300"
        # - name: CLICKHOUSE_HOST
        #   value: "clickhouse-forensic-soc-db.clickhouse.svc.cluster.local"
        # - name: CLICKHOUSE_PORT
        #   value: "9000"
        # - name: CLICKHOUSE_USER
        #   value: "ingest_writer"
        # - name: CLICKHOUSE_PASSWORD
        #   value: "changeme-ingest"
        # - name: CLICKHOUSE_DATABASE
        #   value: "forensic_db"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        runAsUser: 10100
        runAsGroup: 10100
        fsGroup: 10100
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
