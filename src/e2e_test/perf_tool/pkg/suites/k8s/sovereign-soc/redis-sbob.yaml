---
# Empty user-defined ApplicationProfile for the vulnerable redis container.
#
# Why "empty" instead of the learned profile copied from the iximiuz playground:
# Kubescape's auto-learned profile starts in `status: learning` and only
# transitions to `completed` after ~5-10 min of observed traffic. Until the
# transition, R0001/R0002 don't fire — so the first ~half of a 20-min RUN
# window is "silent" and all alerts cluster at the end (verified empirically
# 2026-05-14: 75–82% of forensic_alert_count rows landed in the second half
# of the 2x/4x experiments).
#
# A *user-defined* empty profile + the matching pod label
#   kubescape.io/user-defined-profile: redis-empty
# skips auto-learning and treats every syscall / exec / open / endpoint as
# unprofiled → R0002 et al. fire from t=0. Required for perf-measurement
# experiments where we want detection latency to be the variable of interest.
#
# The profile MUST exist before the pod starts (or the pod must restart
# after the profile is applied) — otherwise Kubescape falls back to
# auto-learning. PrerenderedDeploy applies all YAMLs in one shot in the
# order they appear in YAMLPaths, so list this file BEFORE
# redis-vulnerable.yaml in the WorkloadSpec.
apiVersion: spdx.softwarecomposition.kubescape.io/v1beta1
kind: ApplicationProfile
metadata:
  name: redis-empty
  namespace: redis
spec:
  architectures:
  - amd64
  containers:
  - name: redis        # must match the container name in redis-vulnerable.yaml
    capabilities: null
    endpoints: null
    execs: null
    opens: null
    syscalls: null
    rulePolicies: {}
