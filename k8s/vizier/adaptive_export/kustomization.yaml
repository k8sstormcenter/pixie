---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pl
resources:
- ../bootstrap/adaptive_export_role.yaml
- ../bootstrap/adaptive_export_deployment.yaml
images:
- name: vizier-adaptive_export_image
  # Set locally to the image you deploy; not carried in this repository:
  #   cd k8s/vizier/adaptive_export
  #   kustomize edit set image vizier-adaptive_export_image=<ref>:<version>
  newName: ADAPTIVE_EXPORT_IMAGE
  newTag: latest
