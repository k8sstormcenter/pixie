---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgsql-server
  namespace: px-protocol-loadtest
  labels:
    name: pgsql-server
spec:
  replicas: 1
  selector:
    matchLabels:
      name: pgsql-server
  template:
    metadata:
      labels:
        name: pgsql-server
        kubescape.io/user-defined-profile: pgsql-server-empty
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        env:
        - {name: POSTGRES_USER, value: "postgres"}
        - {name: POSTGRES_PASSWORD, value: "postgres"}
        - {name: POSTGRES_DB, value: "postgres"}
        # Speed up: no synchronous commits for the noop SELECT workload.
        # We don't write anything; this just minimizes WAL overhead.
        args:
        - "postgres"
        - "-c"
        - "fsync=off"
        - "-c"
        - "synchronous_commit=off"
        - "-c"
        - "max_connections=500"
        ports:
        - {name: pg, containerPort: 5432}
        resources:
          requests: {cpu: "200m", memory: "128Mi"}
          limits: {cpu: "4", memory: "2Gi"}
        readinessProbe:
          exec: {command: ["pg_isready", "-U", "postgres"]}
          initialDelaySeconds: 3
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: pgsql-server
  namespace: px-protocol-loadtest
spec:
  selector:
    name: pgsql-server
  ports:
  - {name: pg, port: 5432, targetPort: pg}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgsql-client
  namespace: px-protocol-loadtest
  labels:
    name: pgsql-client
spec:
  replicas: 1
  selector:
    matchLabels:
      name: pgsql-client
  template:
    metadata:
      labels:
        name: pgsql-client
        kubescape.io/user-defined-profile: pgsql-client-empty
    spec:
      initContainers:
      - name: wait-pg
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          for i in $(seq 1 180); do
            pg_isready -h pgsql-server -U postgres && exit 0
            sleep 1
          done
          echo "pgsql-server did not become ready in time"
          exit 1
      containers:
      - name: client
        image: docker.io/library/protocol_loadtest_pgsql_client:latest
        imagePullPolicy: IfNotPresent
        env:
        - {name: PG_HOST, value: "pgsql-server"}
        - {name: PG_PORT, value: "5432"}
        - {name: PG_USER, value: "postgres"}
        - {name: PG_PASSWORD, value: "postgres"}
        - {name: PG_DATABASE, value: "postgres"}
        - {name: PG_SSLMODE, value: "disable"}
        - {name: NUM_CONNECTIONS, value: "10"}
        - {name: TARGET_RPS, value: "1000"}
        - {name: PAD_SIZE, value: "256"}
        - {name: NUM_MESSAGES, value: "5000"}
        resources:
          requests: {cpu: "200m", memory: "128Mi"}
          limits: {cpu: "4", memory: "1Gi"}
