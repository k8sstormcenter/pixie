<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dx attack graph — log4shell-6a32ea57</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; font-family:system-ui, sans-serif; background:#0e1116; color:#e6e6e6; }
  #cy { width:100vw; height:calc(100vh - 60px); }
  header { padding:14px 22px; background:#171a21; border-bottom:1px solid #303641; display:flex; align-items:center; gap:24px; }
  header h1 { margin:0; font-size:14px; font-weight:600; }
  header .legend { display:flex; gap:14px; font-size:12px; align-items:center; }
  header .legend span.swatch { width:14px; height:14px; display:inline-block; border-radius:3px; margin-right:6px; vertical-align:middle; }
  #detail { position:absolute; right:20px; top:80px; max-width:380px; background:#171a21; border:1px solid #303641; border-radius:6px; padding:14px 18px; font-size:12px; line-height:1.4; display:none; }
  #detail h2 { margin:0 0 8px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:#9aa0a6; }
  #detail .row { margin:2px 0; }
  #detail .row b { color:#9aa0a6; font-weight:500; min-width:110px; display:inline-block; }
</style>
</head>
<body>
<header>
  <h1>dx attack graph &mdash; log4shell-6a32ea57</h1>
  <div class="legend">
    <span><span class="swatch" style="background:#d93025"></span>severity 5</span>
    <span><span class="swatch" style="background:#f29900"></span>severity 4</span>
    <span><span class="swatch" style="background:#f9ab00"></span>severity 3</span>
    <span><span class="swatch" style="background:#9aa0a6"></span>severity ≤2</span>
  </div>
  <div style="margin-left:auto; font-size:11px; color:#9aa0a6">edge thickness ∝ weight (Σ CRS severity)</div>
</header>
<div id="cy"></div>
<div id="detail"></div>
<script>
const G = {"edges":[{"data":{"color":"#d93025","condition":"log4shell-rce-exfil","confidence":0.82,"criteria":"jndi-in-http","edge_kind":"delivery","id":"e0","max_severity":5,"num_findings":1,"source":"10.42.1.20","target":"log4j-poc/backend-6d5c7c7dd5-zckw6","weight":5,"width":4}},{"data":{"color":"#f29900","condition":"log4shell-rce-exfil","confidence":0.82,"criteria":"ldap-egress","edge_kind":"egress","id":"e1","max_severity":4,"num_findings":1,"source":"log4j-poc/backend-6d5c7c7dd5-zckw6","target":"10.43.178.167","weight":4,"width":4}},{"data":{"color":"#d93025","condition":"log4shell-rce-exfil","confidence":0.82,"criteria":"process-spawn","edge_kind":"execution","id":"e2","max_severity":5,"num_findings":1,"source":"log4j-poc/backend-6d5c7c7dd5-zckw6","target":"log4j-poc/backend-6d5c7c7dd5-zckw6","weight":5,"width":4}},{"data":{"color":"#f29900","condition":"log4shell-rce-exfil","confidence":0.82,"criteria":"pivot","edge_kind":"pivot","id":"e3","max_severity":4,"num_findings":1,"source":"log4j-poc/backend-6d5c7c7dd5-zckw6","target":"argocd/argocd-repo-server-5f8489c8bf-gxsbc","weight":14,"width":9}}],"nodes":[{"data":{"id":"10.42.1.20","label":"10.42.1.20"}},{"data":{"id":"10.43.178.167","label":"10.43.178.167"}},{"data":{"id":"argocd/argocd-repo-server-5f8489c8bf-gxsbc","label":"argocd/argocd-repo-server-5f8489c8bf-gxsbc"}},{"data":{"id":"log4j-poc/backend-6d5c7c7dd5-zckw6","label":"log4j-poc/backend-6d5c7c7dd5-zckw6"}}]};
const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: { nodes: G.nodes, edges: G.edges },
  style: [
    { selector: 'node', style: {
        'background-color': '#3c4150',
        'label': 'data(label)',
        'color': '#e6e6e6',
        'font-size': 11,
        'text-margin-y': -8,
        'text-wrap': 'wrap',
        'text-max-width': '160px',
        'width': 24, 'height': 24,
    }},
    { selector: 'edge', style: {
        'curve-style': 'bezier',
        'target-arrow-shape': 'triangle',
        'arrow-scale': 1.2,
        'line-color': 'data(color)',
        'target-arrow-color': 'data(color)',
        'width': 'data(width)',
        'label': 'data(edge_kind)',
        'font-size': 10,
        'color': '#9aa0a6',
        'text-rotation': 'autorotate',
        'text-margin-y': -6,
    }},
  ],
  layout: { name: 'cose', animate: false, padding: 40, idealEdgeLength: 180, nodeRepulsion: 4500 },
});
const detail = document.getElementById('detail');



function renderDetail(d) {
  detail.replaceChildren();
  const h2 = document.createElement('h2');
  h2.textContent = 'edge ' + d.id;
  detail.appendChild(h2);
  const rows = [
    ['kind', d.edge_kind], ['condition', d.condition], ['criteria', d.criteria],
    ['weight', d.weight], ['max_severity', d.max_severity], ['confidence', d.confidence],
    ['num_findings', d.num_findings], ['source', d.source], ['target', d.target],
  ];
  for (const [key, val] of rows) {
    const row = document.createElement('div');
    row.className = 'row';
    const b = document.createElement('b');
    b.textContent = key;
    row.appendChild(b);
    row.appendChild(document.createTextNode(String(val)));
    detail.appendChild(row);
  }
}
cy.on('tap', 'edge', e => {
  renderDetail(e.target.data());
  detail.style.display = 'block';
});
cy.on('tap', e => { if (e.target === cy) { detail.style.display = 'none'; }});
</script>
</body>
</html>
