apiVersion: v1
kind: ServiceAccount
metadata: { name: dx-daemon, namespace: honey }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dx-daemon
  namespace: honey
  labels: { app: dx-daemon }
spec:
  selector: { matchLabels: { app: dx-daemon } }
  template:
    metadata:
      labels: { app: dx-daemon }
    spec:
      serviceAccountName: dx-daemon
      tolerations: [{ operator: Exists }]
      terminationGracePeriodSeconds: 35
      containers:
      - name: dx-daemon
        # OBFUSCATED release rc13 (entlein/dx#138 fault 2 RESOLVED): garble -literals
        # (WITHOUT -tiny — -tiny's pclntab stripping SIGSEGV'd under load). Passes the
        # obfuscation gate AND survives the kill-chain (restarts=0, 4 rounds). Carries the
        # evidence-manifest + DX_FOREST_PUSHDOWN code.
        image: docker.io/entlein/dx-daemon:0.4.0-ssotforest-rc23
        ports:
        - { name: findings, containerPort: 9099, hostPort: 9099 }
        env:
        - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
        - { name: HOST_IP, valueFrom: { fieldRef: { fieldPath: status.hostIP } } }
        - { name: DX_RECEIVER_TLS, value: "1" }
        # AE control surface is TLS-by-default (#96); the dx client TLS-skip-verifies
        # the in-cluster (self-signed/shared) cert and attaches its bearer JWT.
        - { name: AE_CONTROL_ADDR, value: "https://adaptive-export-control.pl.svc.cluster.local:9100" }
        - { name: PX_API_KEY, valueFrom: { secretKeyRef: { name: dx-pixie-auth, key: api-key, optional: true } } }
        - { name: PX_CLUSTER_ID, valueFrom: { secretKeyRef: { name: dx-pixie-auth, key: cluster-id, optional: true } } }
        - { name: PX_CLOUD_ADDR, valueFrom: { secretKeyRef: { name: dx-pixie-auth, key: cloud-addr, optional: true } } }
        - { name: DX_BENCH, value: "pemdirect" }
        - { name: PL_JWT_SIGNING_KEY, valueFrom: { secretKeyRef: { name: dx-vizier-direct, key: jwt-signing-key, optional: true } } }
        - { name: DX_VIZIER_DIRECT_ADDR, value: "vizier-query-broker-svc.pl.svc.cluster.local:50300" }
        - { name: PX_DISABLE_TLS, value: "1" }
        - { name: DX_CLUSTER_MALIGNANT_HTTP, valueFrom: { secretKeyRef: { name: dx-metastasis-ch, key: http-url, optional: true } } }
        - { name: DX_PX_TIMEOUT_S, value: "90" }
        - { name: DX_TELEMETRY_CACHE, value: "1" }
        - { name: DX_WORKERS, value: "4" }
        # evidence-graph: forest-scope the evidence, write the per-anomaly edge set,
        # sink it straight to forensic_db.dx_evidence_graph (soc ingest_writer).
        - { name: DX_FOREST_SCOPE, value: "1" }
        # FOREST_PUSHDOWN (entlein/dx#138 fault 3): push the dc_snoop ppid-lineage filter
        # INTO the PxL so dx pulls only the alert pod's subtree, not the whole node —
        # frees the node-local PEM so AE can export dc_snoop under load (validated: 0→1777).
        - { name: DX_FOREST_PUSHDOWN, value: "1" }
        - { name: DX_FOREST_PUSHDOWN_DEPTH, value: "4" }
        - { name: DX_PRECORRELATE_GRAPH, value: "1" }
        - { name: DX_EVIDENCE_GRAPH_CH, value: "http://ingest_writer:changeme-ingest@clickhouse-forensic-soc-db.clickhouse.svc.cluster.local:8123/forensic_db" }
        readinessProbe:
          httpGet: { path: /healthz, port: 9099, scheme: HTTPS }
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          # memory: the precorrelate/full-evidence workup (DX_PRECORRELATE_GRAPH) + pemdirect
          # gRPC result streams pull the per-anomaly evidence set into memory; at 1Gi dx is
          # OOM-killed mid-workup (exit 137) BEFORE it writes the graph → crash-loop, empty
          # graph. Measured peak ~1.3GB/round under the redis kill-chain (entlein/dx#138
          # fault 1); 3Gi clears it reliably on an 8GiB node (validated: restarts=0 over 6+ rounds).
          requests: { cpu: 50m, memory: 1Gi }
          limits:   { cpu: "2", memory: 3Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: dx-daemon
  namespace: honey
spec:
  selector: { app: dx-daemon }
  internalTrafficPolicy: Local
  ports:
  - { name: findings, port: 9099, targetPort: 9099 }
